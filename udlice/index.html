<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Voda Údlice</title>
<style>
:root{--bg:#f3f6f6;--fg:#14232a;--muted:#5b6d73;--line:#d5dfe1;--accent:#0f6a7a;--ink:#fff;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1719;--fg:#e3ecee;--muted:#93a6ab;--line:#2a3a3f;--accent:#4fb3c4;--ink:#06191d;--card:#162226;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:40px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px}
h1{margin:0;font-size:1.6rem}
p{margin:0;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:10px}
a.btn{display:inline-block;background:var(--accent);color:var(--ink);text-decoration:none;font-weight:600;padding:12px 18px;border-radius:8px;justify-self:start}
a.btn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>Voda Údlice</h1>
  <p>Společná vodovodní přípojka, parc. 1116/1-50 – odečty vodoměrů a vyúčtování.</p>
  <div class="card">
    <strong>Aplikace s odečty a vyúčtováním</strong>
    <p>Běží na claude.ai. Otevře se jen přihlášeným, se kterými je sdílená.</p>
    <a class="btn" href="https://claude.ai/artifact/Tzww2hdonF3byEZuApDu17">Otevřít aplikaci</a>
  </div>
</main>
</body>
</html>
